name: Build WF
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ECR_REPOSITORY: 'infra-website'

permissions:
  contents: read

jobs:
  build: 
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Maven Build
        run: mvn install
      
      - name: Show build output
        run: |
          pwd
          ls -lah
          ls -lah target/

      - name: Upload Build artifact  (WAR) 
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-app
          path: target/*.war

      - name: Notify build status if failed
        if: failure()
        run: echo "Build failed. Please check the logs for details."

  Testing:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Run test on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Checkstyle
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle

      - name: Run test on other branches
        if: github.ref != 'refs/heads/main'
        run: echo "Tests are only run on the main branch. Skipping tests for this branch."
  
  Security-Scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Trvis Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: .
          format: json
          exit-code: '0'
          vuln-type: 'os,library'
          output: 'trivy-results.json'

      - name: Upload Trivy Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json

  BUILD_AND_PUBLISH:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    environment: production
    needs: [build, Testing, Security-Scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Config AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.ACTIONS_ECR_ID }}
          aws-secret-access-key: ${{ secrets.ACTIONS_ECR_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t Docker-files/app/multistage/Dockerfile -t $ECR_REGISTRY:$ECR_REPOSITORY:${IMAGE_TAG} .
          docker push $ECR_REGISTRY:$ECR_REPOSITORY:${IMAGE_TAG}